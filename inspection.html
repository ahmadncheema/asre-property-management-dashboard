<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"
    />
    <title>ASRE — Inspections</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      .insp-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--blue);
        border-radius: var(--radius);
        padding: 16px 18px;
        margin-bottom: 12px;
      }
      .insp-card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
      }
      .insp-title {
        font-weight: 700;
        color: var(--white);
        font-size: 1rem;
      }
      .insp-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .insp-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .filter-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .filter-bar select {
        min-width: 180px;
        flex: 1;
      }

      .phase-bar {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--bg);
        padding: 10px 0;
        display: flex;
        gap: 10px;
        margin-bottom: 8px;
      }
      .phase-bar button {
        flex: 1;
        padding: 13px 8px;
        border-radius: var(--radius-sm);
        border: 2px solid var(--border);
        background: var(--bg-card);
        color: var(--text);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.92rem;
      }
      .phase-bar button.on {
        border-color: var(--green);
        color: var(--green);
        background: rgba(62, 173, 130, 0.1);
      }
      .phase-bar small {
        display: block;
        font-weight: 500;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .form-section {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        margin-bottom: 16px;
      }
      .form-section h3 {
        margin: 0 0 6px;
        font-size: 0.95rem;
        color: var(--blue-light);
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }
      .form-section .hint {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 14px;
        font-style: italic;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .grid-2 .full {
        grid-column: 1 / -1;
      }
      .grid-2 .form-group {
        margin: 0;
      }

      .row-card {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }
      .row-card:first-of-type {
        border-top: none;
      }
      .row-name {
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .row-name input {
        background: transparent;
        border: none;
        color: var(--white);
        font-weight: 700;
        font-size: 0.95rem;
        flex: 1;
        min-width: 0;
        padding: 0;
      }
      .row-fields {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .row-fields .form-control {
        flex: 1;
        min-width: 120px;
      }
      .seg {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .seg button {
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-muted);
        padding: 8px 12px;
        font-size: 0.78rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        min-width: 52px;
      }
      .seg button.on-G,
      .seg button.on-Y {
        background: rgba(62, 173, 130, 0.2);
        color: var(--green);
        border-color: var(--green);
      }
      .seg button.on-F {
        background: rgba(240, 165, 0, 0.2);
        color: var(--warning);
        border-color: var(--warning);
      }
      .seg button.on-P,
      .seg button.on-N {
        background: rgba(229, 83, 83, 0.2);
        color: var(--danger);
        border-color: var(--danger);
      }
      .seg button.on-NA {
        background: rgba(136, 150, 168, 0.2);
        color: var(--text);
        border-color: var(--text-muted);
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .other {
        font-size: 0.76rem;
        color: var(--text-muted);
        margin-top: 6px;
      }
      .other b {
        color: var(--text);
      }
      .num-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .num-row span.n {
        width: 22px;
        color: var(--text-muted);
        font-size: 0.82rem;
        text-align: right;
        flex-shrink: 0;
      }
      .num-row .form-control {
        flex: 1;
        min-width: 0;
      }
      .build-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: flex-end;
        margin-bottom: 14px;
      }
      .build-row .form-group {
        margin: 0;
        width: 100px;
      }
      .photos {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .photo {
        position: relative;
        width: 84px;
        height: 84px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo button {
        position: absolute;
        top: 2px;
        right: 2px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        cursor: pointer;
        line-height: 1;
      }
      .photo i {
        position: absolute;
        left: 3px;
        bottom: 3px;
        font-style: normal;
        font-size: 0.62rem;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 1px 5px;
        border-radius: 4px;
      }
      .add-photo {
        width: 84px;
        height: 84px;
        border-radius: 8px;
        border: 2px dashed var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        color: var(--text-muted);
        cursor: pointer;
        text-align: center;
      }
      .sticky-bar {
        position: sticky;
        bottom: 0;
        background: var(--bg);
        border-top: 1px solid var(--border);
        padding: 12px 0;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
        z-index: 5;
      }

      @media (max-width: 640px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .sticky-bar .btn {
          flex: 1;
        }
        .insp-actions .btn {
          flex: 1;
        }
        .seg button {
          flex: 1;
        }
        .page-header {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .page-header .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav id="main-nav"></nav>
    <div class="page-wrapper">
      <div class="container">
        <!-- ═════════ LIST ═════════ -->
        <div id="list-view">
          <div class="page-header">
            <div>
              <div class="page-title">
                Move-In / Move-Out <span>Inspections</span>
              </div>
              <div class="page-subtitle">
                One form per tenancy: fill Move-In at handover, Move-Out when
                the tenant leaves
              </div>
            </div>
            <button class="btn btn-green" onclick="newForm()">
              + New Inspection Form
            </button>
          </div>
          <div class="filter-bar">
            <select
              class="form-control"
              id="f-building"
              onchange="renderList()"
            >
              <option value="">All Buildings</option>
            </select>
            <select class="form-control" id="f-status" onchange="renderList()">
              <option value="">All forms</option>
              <option value="waiting">Waiting for Move-Out</option>
              <option value="done">Move-Out done</option>
            </select>
            <input
              class="form-control"
              id="f-search"
              placeholder="🔍 Search unit or tenant..."
              oninput="renderList()"
              style="flex: 1; min-width: 160px"
            />
          </div>
          <div id="list">
            <div class="loading-state">
              <div class="spinner"></div>
              <p>Loading...</p>
            </div>
          </div>
        </div>

        <!-- ═════════ FORM ═════════ -->
        <div id="form-view" style="display: none">
          <div class="page-header">
            <div>
              <div class="page-title" id="form-title">
                Inspection <span>Form</span>
              </div>
              <div class="page-subtitle">
                Tenant Move-In / Move-Out Inspection Form · Property Handover
                &amp; Unit Condition Report
              </div>
            </div>
            <button class="btn btn-outline" onclick="backToList()">
              ← Back
            </button>
          </div>

          <div class="phase-bar">
            <button type="button" id="ph-in" onclick="setPhase('in')">
              Move-In<small>left-hand columns</small>
            </button>
            <button type="button" id="ph-out" onclick="setPhase('out')">
              Move-Out<small>right-hand columns</small>
            </button>
          </div>

          <div id="form-body"></div>

          <div class="sticky-bar">
            <button class="btn btn-outline" onclick="downloadPdf()">
              ⬇ PDF
            </button>
            <button class="btn btn-outline" onclick="emailCurrent()">
              ✉ Email tenant
            </button>
            <button class="btn btn-green" id="btn-save" onclick="saveForm()">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { requireAuth } from "./js/auth.js";
      import {
        renderNav,
        showToast,
        showConfirm,
        formatDate,
      } from "./js/shared.js";
      import { supabase } from "./js/supabase.js";
      import {
        buildInspectionPdf,
        inspectionFilename,
        emptyForm,
        emptyArea,
        defaultAreas,
        COND,
        YN,
      } from "./js/inspection-pdf.js";

      const session = requireAuth();
      if (!session) throw new Error("Not authenticated");
      if (session.role === "finance") {
        window.location.href = "/finance.html";
        throw new Error("Access denied");
      }
      renderNav("inspection");

      // ── State ─────────────────────────────────────────────────────
      let buildings = [],
        units = [],
        forms = [];
      let cur = null; // the form being edited
      let phase = "in"; // which columns are being filled: 'in' or 'out'
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const byNum = (a, b) =>
        String(a).localeCompare(String(b), undefined, { numeric: true });
      const today = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
      };
      const bName = (id) => buildings.find((b) => b.id === id)?.name || "?";
      const uNo = (id) => units.find((u) => u.id === id)?.unit_number || "?";
      const other = () => (phase === "in" ? "out" : "in");
      const PH = { in: "Move-In", out: "Move-Out" };

      // Read / write a value by path, e.g. "keys.2.qty_in"
      const getP = (p) =>
        p.split(".").reduce((o, k) => (o == null ? o : o[k]), cur);
      const setPv = (p, v) => {
        const ks = p.split(".");
        const last = ks.pop();
        ks.reduce((o, k) => o[k], cur)[last] = v;
      };
      window.setP = (el) =>
        setPv(el.dataset.p, el.type === "checkbox" ? el.checked : el.value);
      window.setSeg = (p, v) => {
        setPv(p, getP(p) === v ? "" : v);
        render();
      };

      // Small builders for inputs
      const inp = (p, o = {}) =>
        `<input class="form-control" data-p="${p}" value="${esc(getP(p))}" ${o.type ? `type="${o.type}"` : ""} ${o.mode ? `inputmode="${o.mode}"` : ""} ${o.ph ? `placeholder="${esc(o.ph)}"` : ""} oninput="setP(this)" />`;
      const field = (label, p, o = {}) =>
        `<div class="form-group ${o.full ? "full" : ""}"><label class="form-label">${label}</label>${inp(p, o)}</div>`;
      const seg = (p, opts) =>
        `<div class="seg">${opts.map(([v, l]) => `<button type="button" class="${getP(p) === v ? "on-" + v : ""}" onclick="setSeg('${p}','${v}')">${l}</button>`).join("")}</div>`;
      const CONDS = Object.entries(COND).map(([k, v]) => [k, v]);
      const YNS = Object.entries(YN).map(([k, v]) => [k, v]);

      // ── Load + list ───────────────────────────────────────────────
      async function init() {
        const [b, u] = await Promise.all([
          supabase.from("buildings").select("*").order("name"),
          supabase.from("units").select("*"),
        ]);
        buildings = b.data || [];
        units = u.data || [];
        $("f-building").innerHTML =
          '<option value="">All Buildings</option>' +
          buildings
            .map((x) => `<option value="${x.id}">${esc(x.name)}</option>`)
            .join("");
        await loadList();
      }

      async function loadList() {
        const { data, error } = await supabase
          .from("inspection_forms")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) {
          $("list").innerHTML =
            `<p style="color:var(--danger)">Could not load the forms. Has inspections-setup.sql been run in Supabase? (${esc(error.message)})</p>`;
          return;
        }
        forms = data || [];
        renderList();
      }

      window.renderList = function () {
        const fb = $("f-building").value,
          fs = $("f-status").value,
          q = $("f-search").value.toLowerCase().trim();
        const list = forms.filter(
          (f) =>
            (!fb || f.building_id === fb) &&
            (!fs || (fs === "done" ? !!f.insp_out_date : !f.insp_out_date)) &&
            (!q ||
              uNo(f.unit_id).toLowerCase().includes(q) ||
              (f.tenant_name || "").toLowerCase().includes(q)),
        );
        if (!list.length) {
          $("list").innerHTML =
            '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-title">No forms yet</div><div class="empty-state-text">Tap "+ New Inspection Form" when a tenant moves in.</div></div>';
          return;
        }
        $("list").innerHTML = list
          .map((f) => {
            const photos = (f.areas || []).reduce(
              (n, a) => n + (a.photos || []).length,
              0,
            );
            return `<div class="insp-card">
            <div class="insp-card-top">
              <div>
                <div class="insp-title">${esc(bName(f.building_id))} — Unit ${esc(uNo(f.unit_id))}</div>
                <div class="insp-meta">${esc(f.tenant_name || "No tenant name")} · ${(f.areas || []).length} areas · ${photos} photos</div>
              </div>
              <div>
                <span class="badge ${f.insp_in_date ? "badge-blue" : "badge-grey"}">${f.insp_in_date ? "Move-In " + formatDate(f.insp_in_date) : "Move-In pending"}</span>
                <span class="badge ${f.insp_out_date ? "badge-orange" : "badge-grey"}">${f.insp_out_date ? "Move-Out " + formatDate(f.insp_out_date) : "Move-Out pending"}</span>
                ${f.emailed_at ? '<span class="badge badge-green">Emailed</span>' : ""}
              </div>
            </div>
            <div class="insp-actions">
              <button class="btn btn-outline btn-sm" onclick="openForm('${f.id}')">${f.insp_in_date && !f.insp_out_date ? "Do Move-Out" : "Open / Edit"}</button>
              <button class="btn btn-outline btn-sm" onclick="pdfFor('${f.id}')">⬇ PDF</button>
              <button class="btn btn-outline btn-sm" onclick="emailFor('${f.id}')">✉ Email</button>
              <button class="btn btn-danger btn-sm" onclick="deleteForm('${f.id}')">Delete</button>
            </div>
          </div>`;
          })
          .join("");
      };

      // ── Open / create ─────────────────────────────────────────────
      function show(view) {
        $("list-view").style.display = view === "list" ? "" : "none";
        $("form-view").style.display = view === "form" ? "" : "none";
        window.scrollTo(0, 0);
      }
      window.backToList = function () {
        show("list");
        loadList();
      };

      window.newForm = function () {
        cur = emptyForm();
        cur.inspector = session.full_name || "";
        phase = "in";
        show("form");
        render();
      };
      window.openForm = function (id) {
        const f = forms.find((x) => x.id === id);
        if (!f) return;
        cur = JSON.parse(JSON.stringify(f));
        cur.isNew = false;
        // Show blanks (not nulls) in the inputs
        Object.keys(cur).forEach((k) => {
          if (cur[k] === null) cur[k] = "";
        });
        phase = cur.insp_in_date ? "out" : "in";
        show("form");
        render();
      };
      window.setPhase = function (p) {
        phase = p;
        render();
      };

      // ── Render the whole form ─────────────────────────────────────
      function render() {
        if (!cur) return;
        $("ph-in").classList.toggle("on", phase === "in");
        $("ph-out").classList.toggle("on", phase === "out");
        $("form-title").innerHTML = cur.isNew
          ? "New Inspection <span>Form</span>"
          : `${esc(bName(cur.building_id))} <span>Unit ${esc(uNo(cur.unit_id))}</span>`;
        const dateKey = `insp_${phase}_date`;
        const unitList = units
          .filter((u) => u.building_id === cur.building_id)
          .sort((a, b) => byNum(a.unit_number, b.unit_number));

        $("form-body").innerHTML = `
        <div class="form-section">
          <h3>${PH[phase]} Inspection</h3>
          <div class="hint">Tick items as you walk through the unit. The ${PH[other()]} side of the form stays as it is.</div>
          <div class="grid-2">
            ${field(PH[phase] + " inspection date", dateKey, { type: "date" })}
            ${field("Inspector", "inspector")}
          </div>
        </div>

        <div class="form-section">
          <h3>1. Property &amp; Tenancy Details</h3>
          <div class="grid-2">
            <div class="form-group"><label class="form-label">Property / Building Name *</label>
              <select class="form-control" onchange="pickBuilding(this.value)"><option value="">Select building...</option>${buildings.map((b) => `<option value="${b.id}" ${b.id === cur.building_id ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select></div>
            <div class="form-group"><label class="form-label">Unit No. *</label>
              <select class="form-control" onchange="pickUnit(this.value)"><option value="">Select unit...</option>${unitList.map((u) => `<option value="${u.id}" ${u.id === cur.unit_id ? "selected" : ""}>${esc(u.unit_number)}</option>`).join("")}</select></div>
            ${field("Location / Community", "location", { full: true })}
            ${field("Landlord name", "landlord_name", { full: true })}
            ${field("Landlord Emirates ID", "landlord_eid")}
            ${field("Landlord tel", "landlord_tel", { mode: "tel" })}
            ${field("Landlord email", "landlord_email", { type: "email", full: true })}
            ${field("Tenant name", "tenant_name", { full: true })}
            ${field("Tenancy contract no.", "contract_no")}
            ${field("Ejari registration no.", "ejari_no")}
            ${field("Contract period (from)", "contract_from", { type: "date" })}
            ${field("Contract period (to)", "contract_to", { type: "date" })}
            ${field("Annual rent (AED)", "annual_rent", { mode: "decimal" })}
            ${field("Security deposit (AED)", "security_deposit", { mode: "decimal" })}
            ${field("Move-in date", "move_in_date", { type: "date" })}
            ${field("Move-out date", "move_out_date", { type: "date" })}
          </div>
        </div>

        <div class="form-section">
          <h3>2. Tenant Contact Information</h3>
          <div class="grid-2">
            ${field("Mobile number", "tenant_mobile", { mode: "tel" })}
            ${field("Email address", "tenant_email", { type: "email" })}
            ${field("Emirates ID no.", "emirates_id")}
            ${field("Nationality", "nationality")}
            ${field("Passport no.", "passport_no")}
            ${field("Forwarding address (Move-Out)", "forwarding_address")}
          </div>
        </div>

        <div class="form-section">
          <h3>3. Occupants Residing in the Unit</h3>
          <div class="hint">Occupancy is limited to the registered Tenant and immediate family members only.</div>
          ${cur.occupants
            .map(
              (o, i) => `<div class="row-card"><div class="row-fields">
              <span class="n" style="width:20px;color:var(--text-muted)">${i + 1}</span>
              ${inp(`occupants.${i}.name`, { ph: "Full name" })}${inp(`occupants.${i}.relationship`, { ph: "Relationship to tenant" })}${inp(`occupants.${i}.id_no`, { ph: "Emirates ID / Passport no." })}
            </div></div>`,
            )
            .join("")}
          <button type="button" class="btn btn-outline btn-sm" onclick="addOccupant()">+ Add occupant</button>
        </div>

        <div class="form-section">
          <h3>4. Utility Accounts &amp; Meter Readings</h3>
          <div class="hint">The Tenant transfers utility accounts into their own name at move-in, and settles final bills at move-out.</div>
          ${cur.utilities
            .map(
              (u, i) => `<div class="row-card">
              <div class="row-name">${esc(u.name)}</div>
              <div class="row-fields">${inp(`utilities.${i}.account`, { ph: "Account no." })}${inp(`utilities.${i}.read_${phase}`, { ph: "Reading at " + PH[phase] })}</div>
              ${u["read_" + other()] ? `<div class="other">${PH[other()]} reading: <b>${esc(u["read_" + other()])}</b></div>` : ""}
            </div>`,
            )
            .join("")}
        </div>

        <div class="form-section">
          <h3>5. Keys &amp; Access Devices</h3>
          <div class="hint">${phase === "in" ? "Quantity issued to the tenant, and tick when the tenant confirms." : "Quantity returned by the tenant, and tick when confirmed."}</div>
          ${cur.keys
            .map(
              (k, i) => `<div class="row-card">
              <div class="row-name">${esc(k.item)}</div>
              <div class="row-fields">
                ${inp(`keys.${i}.qty_${phase}`, { mode: "numeric", ph: phase === "in" ? "Qty issued" : "Qty returned" })}
                <label class="chk"><input type="checkbox" data-p="keys.${i}.conf_${phase}" ${k["conf_" + phase] ? "checked" : ""} onchange="setP(this)" /> Confirmed</label>
              </div>
              ${k["qty_" + other()] || k["conf_" + other()] ? `<div class="other">${PH[other()]}: <b>${esc(k["qty_" + other()] || "-")}</b>${k["conf_" + other()] ? " (confirmed)" : ""}</div>` : ""}
            </div>`,
            )
            .join("")}
        </div>

        <div class="form-section">
          <h3>6. Unit Condition Inspection</h3>
          <div class="hint">Condition key: Good · Fair · Poor · N/A (area not in this unit).</div>
          <div class="build-row">
            <div class="form-group"><label class="form-label">Bedrooms</label><input type="number" min="0" max="10" class="form-control" id="b-bed" value="${Math.max(0, cur.areas.filter((a) => /bedroom/i.test(a.name)).length)}" /></div>
            <div class="form-group"><label class="form-label">Bathrooms</label><input type="number" min="0" max="10" class="form-control" id="b-bath" value="${cur.areas.filter((a) => /^bathroom/i.test(a.name)).length}" /></div>
            <button type="button" class="btn btn-outline" onclick="rebuildAreas()">Rebuild areas</button>
          </div>
          ${cur.areas.map((a, i) => areaHtml(a, i)).join("")}
          <div style="margin-top:12px"><button type="button" class="btn btn-outline btn-sm" onclick="addArea()">+ Add area</button></div>

          <h3 style="margin-top:22px">${PH[phase]} remarks ${phase === "in" ? "(recorded prior to handover)" : ""}</h3>
          ${cur["remarks_" + phase].map((r, i) => `<div class="num-row"><span class="n">${i + 1}</span>${inp(`remarks_${phase}.${i}`, { ph: "Remark..." })}<button type="button" class="btn btn-outline btn-sm" onclick="delRemark(${i})">×</button></div>`).join("")}
          <button type="button" class="btn btn-outline btn-sm" onclick="addRemark()">+ Add remark</button>
          ${
            cur["remarks_" + other()].some((t) => t && t.trim())
              ? `<div class="other" style="margin-top:10px">${PH[other()]} remarks:<br>${cur[
                  "remarks_" + other()
                ]
                  .filter((t) => t && t.trim())
                  .map((t, i) => `${i + 1}. ${esc(t)}`)
                  .join("<br>")}</div>`
              : ""
          }
        </div>

        <div class="form-section">
          <h3>7. Appliances &amp; Fixtures <span style="text-transform:none;font-weight:500;color:var(--text-muted)">(if furnished / semi-furnished)</span></h3>
          ${cur.appliances
            .map(
              (a, i) => `<div class="row-card">
              <div class="row-name">${esc(a.name)}</div>
              <div class="row-fields">${seg(`appliances.${i}.w_${phase}`, YNS)}${inp(`appliances.${i}.remarks`, { ph: "Remarks" })}</div>
              ${a["w_" + other()] ? `<div class="other">${PH[other()]} working: <b>${YN[a["w_" + other()]]}</b></div>` : ""}
            </div>`,
            )
            .join("")}
        </div>

        <div class="form-section">
          <h3>8. Documents Collected From Tenant (Move-In)</h3>
          ${cur.documents
            .map(
              (d, i) => `<div class="row-card">
              <div class="row-name">${i + 1}. ${esc(d.name)}</div>
              ${seg(`documents.${i}.status`, [
                ["Y", "Received"],
                ["NA", "N/A"],
              ])}
            </div>`,
            )
            .join("")}
        </div>`;
      }

      function areaHtml(a, i) {
        const o = other();
        const oc = a[o + "_cond"],
          orem = a[o + "_rem"];
        return `<div class="row-card">
          <div class="row-name"><input value="${esc(a.name)}" data-p="areas.${i}.name" oninput="setP(this)" />
            <button type="button" class="btn btn-outline btn-sm" onclick="delArea(${i})">Remove</button></div>
          ${seg(`areas.${i}.${phase}_cond`, CONDS)}
          <input class="form-control" style="margin-top:8px" data-p="areas.${i}.${phase}_rem" value="${esc(a[phase + "_rem"])}" placeholder="${PH[phase]} remarks (e.g. damage, marks)" oninput="setP(this)" />
          ${oc || orem ? `<div class="other">${PH[o]}: <b>${oc ? COND[oc] : "-"}</b>${orem ? " — " + esc(orem) : ""}</div>` : ""}
          <div class="photos">
            ${(a.photos || []).map((p, pi) => `<div class="photo"><img src="${esc(p.url || p.data)}" alt="" /><i>${p.phase === "out" ? "OUT" : "IN"}</i>${p.phase === phase ? `<button type="button" onclick="removePhoto(${i},${pi})">×</button>` : ""}</div>`).join("")}
            <label class="add-photo"><span style="font-size:1.4rem">📷</span>Add photos<input type="file" accept="image/*" multiple hidden onchange="addPhotos(${i}, this)" /></label>
          </div>
        </div>`;
      }

      // ── Form actions ──────────────────────────────────────────────
      // Fill a field from saved data. Brand-new forms are always filled;
      // forms already saved only get their empty fields filled.
      const fillF = (k, v) => {
        if (v === undefined || v === null || v === "") return;
        if (cur.isNew || !cur[k]) cur[k] = String(v);
      };
      window.pickBuilding = (id) => {
        cur.building_id = id;
        cur.unit_id = "";
        const b = buildings.find((x) => x.id === id);
        if (b) {
          fillF("location", b.location_area || b.address);
          fillF("landlord_name", b.landlord_name || b.owner_name);
          fillF("landlord_eid", b.landlord_eid);
          fillF("landlord_tel", b.landlord_phone);
          fillF("landlord_email", b.landlord_email);
        }
        render();
      };
      window.pickUnit = (id) => {
        cur.unit_id = id;
        const u = units.find((x) => x.id === id);
        if (u) {
          fillF("tenant_name", u.tenant_name);
          fillF("tenant_mobile", u.tenant_whatsapp);
          fillF("tenant_email", u.tenant_email);
          fillF("annual_rent", u.rent);
          fillF("security_deposit", u.deposit);
          fillF("contract_from", u.start_date);
          fillF("contract_to", u.end_date);
        }
        render();
      };
      window.addOccupant = () => {
        cur.occupants.push({ name: "", relationship: "", id_no: "" });
        render();
      };
      window.addRemark = () => {
        cur["remarks_" + phase].push("");
        render();
      };
      window.delRemark = (i) => {
        const l = cur["remarks_" + phase];
        l.splice(i, 1);
        if (!l.length) l.push("");
        render();
      };
      window.addArea = () => {
        cur.areas.push(emptyArea("New area"));
        render();
      };
      window.delArea = async (i) => {
        if (!(await showConfirm("Remove this area (and its photos)?"))) return;
        cur.areas.splice(i, 1);
        render();
      };
      window.rebuildAreas = async () => {
        const bed = Math.max(0, parseInt($("b-bed").value) || 0),
          bath = Math.max(0, parseInt($("b-bath").value) || 0);
        if (
          !(await showConfirm(
            "This replaces the area list, including anything entered under Section 6. Continue?",
          ))
        )
          return;
        cur.areas = defaultAreas(bed, bath, true);
        render();
      };

      // ── Photos: shrink on the phone before anything is sent ───────
      async function compress(file, max = 1200) {
        const url = URL.createObjectURL(file);
        const img = await new Promise((res, rej) => {
          const i = new Image();
          i.onload = () => res(i);
          i.onerror = rej;
          i.src = url;
        });
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        let q = 0.78,
          out = c.toDataURL("image/jpeg", q);
        while (out.length * 0.75 > 300 * 1024 && q > 0.4) {
          q -= 0.08;
          out = c.toDataURL("image/jpeg", q);
        }
        return out;
      }
      window.addPhotos = async function (i, input) {
        const files = [...input.files];
        input.value = "";
        for (const f of files) {
          try {
            cur.areas[i].photos.push({ data: await compress(f), phase });
          } catch (e) {
            showToast("Could not read one of the photos.", "error");
          }
        }
        render();
      };
      window.removePhoto = (i, pi) => {
        cur.areas[i].photos.splice(pi, 1);
        render();
      };

      // ── Save ──────────────────────────────────────────────────────
      const COLS = [
        "building_id",
        "unit_id",
        "location",
        "landlord_name",
        "landlord_eid",
        "landlord_tel",
        "landlord_email",
        "tenant_name",
        "contract_no",
        "ejari_no",
        "contract_from",
        "contract_to",
        "annual_rent",
        "security_deposit",
        "move_in_date",
        "move_out_date",
        "tenant_mobile",
        "tenant_email",
        "emirates_id",
        "nationality",
        "passport_no",
        "forwarding_address",
        "inspector",
        "insp_in_date",
        "insp_out_date",
        "occupants",
        "utilities",
        "keys",
        "areas",
        "remarks_in",
        "remarks_out",
        "appliances",
        "documents",
      ];
      const DATES = [
        "contract_from",
        "contract_to",
        "move_in_date",
        "move_out_date",
        "insp_in_date",
        "insp_out_date",
      ];
      const NUMS = ["annual_rent", "security_deposit"];

      function payload() {
        const row = { id: cur.id };
        COLS.forEach((c) => {
          row[c] = cur[c];
        });
        DATES.forEach((c) => {
          if (!row[c]) row[c] = null;
        });
        NUMS.forEach((c) => {
          row[c] =
            row[c] === "" || row[c] == null
              ? null
              : parseFloat(String(row[c]).replace(/,/g, "")) || 0;
        });
        return row;
      }

      window.saveForm = async function () {
        if (!cur.building_id || !cur.unit_id) {
          showToast("Choose the building and unit first.", "error");
          return;
        }
        const dk = `insp_${phase}_date`;
        if (!cur[dk]) cur[dk] = today();
        const btn = $("btn-save");
        btn.disabled = true;
        try {
          // 1. Upload new photos to the server
          const pending = cur.areas.flatMap((a) =>
            a.photos.filter((p) => !p.url),
          );
          let n = 0;
          for (const p of pending) {
            btn.textContent = `Uploading photo ${++n} of ${pending.length}...`;
            const res = await fetch("/api/inspection-photo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ inspectionId: cur.id, data: p.data }),
            });
            const j = await res.json().catch(() => ({}));
            if (!res.ok || !j.url)
              throw new Error(
                j.error ||
                  "Photo upload failed (photos can only be saved on the live server)",
              );
            p.url = j.url;
            delete p.data;
          }
          // 2. Save the form
          btn.textContent = "Saving...";
          const row = { ...payload(), updated_at: new Date().toISOString() };
          let error;
          if (cur.isNew)
            ({ error } = await supabase
              .from("inspection_forms")
              .insert({ ...row, created_by: session.full_name }));
          else
            ({ error } = await supabase
              .from("inspection_forms")
              .update(row)
              .eq("id", cur.id));
          if (error) throw new Error(error.message);
          showToast(PH[phase] + " inspection saved.");
          backToList();
        } catch (err) {
          console.error(err);
          showToast(err.message, "error");
          render();
        }
        btn.disabled = false;
        btn.textContent = "Save";
      };

      window.deleteForm = async function (id) {
        if (
          !(await showConfirm(
            "Delete this inspection form? This cannot be undone.",
          ))
        )
          return;
        await supabase.from("inspection_forms").delete().eq("id", id);
        showToast("Deleted.");
        loadList();
      };

      // ── PDF + email ───────────────────────────────────────────────
      const ctxFor = (f) => ({
        buildingName: bName(f.building_id),
        unitNumber: uNo(f.unit_id),
      });
      async function doPdf(f) {
        showToast("Building PDF...");
        try {
          const doc = await buildInspectionPdf(f, ctxFor(f));
          doc.save(inspectionFilename(f, ctxFor(f)));
        } catch (e) {
          console.error(e);
          showToast("Could not build the PDF: " + e.message, "error");
        }
      }
      async function doEmail(f) {
        let to = f.tenant_email || window.prompt("Tenant email address:", "");
        if (!to) return;
        to = to.trim();
        showToast("Preparing email...");
        try {
          const ctx = ctxFor(f);
          const doc = await buildInspectionPdf(f, ctx);
          const b64 = doc.output("datauristring").split(",")[1];
          const res = await fetch("/api/send-inspection", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              to,
              tenantName: f.tenant_name,
              buildingName: ctx.buildingName,
              unitNumber: ctx.unitNumber,
              type: f.insp_out_date ? "move_out" : "move_in",
              date: f.insp_out_date || f.insp_in_date,
              pdfBase64: b64,
              filename: inspectionFilename(f, ctx),
            }),
          });
          const j = await res.json().catch(() => ({}));
          if (!res.ok)
            throw new Error(
              j.error || "Email failed (emails only work on the live server)",
            );
          const stamp = new Date().toISOString();
          await supabase
            .from("inspection_forms")
            .update({ emailed_at: stamp })
            .eq("id", f.id);
          f.emailed_at = stamp;
          showToast("Form emailed to " + to);
        } catch (e) {
          console.error(e);
          showToast(e.message, "error");
        }
      }
      window.pdfFor = (id) => doPdf(forms.find((x) => x.id === id));
      window.emailFor = (id) => doEmail(forms.find((x) => x.id === id));
      // From inside the form: uses what is on screen, including unsaved photos
      window.downloadPdf = () => doPdf(cur);
      window.emailCurrent = () => {
        const saved = forms.find((x) => x.id === cur.id);
        if (cur.isNew || !saved) {
          showToast("Save the form first, then email it.", "error");
          return;
        }
        doEmail(saved);
      };

      init();
    </script>
  </body>
</html>
