<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>"
    />
    <title>ASRE — Landlord Portal</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
      .ll-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
      @media (max-width: 600px) { .ll-actions .btn { width: 100%; } }
    </style>
  </head>
  <body>
    <nav id="main-nav"></nav>
    <div class="page-wrapper">
      <div class="container">
        <div class="page-header">
          <div>
            <div class="page-title">My <span>Buildings</span></div>
            <div class="page-subtitle" id="ll-sub">Loading...</div>
          </div>
        </div>

        <div class="ll-actions">
          <button class="btn btn-green" onclick="openReportPicker()">
            📊 Monthly Report
          </button>
        </div>

        <div id="ll-sign"></div>

        <div id="ll-body">
          <div class="loading-state"><div class="spinner"></div></div>
        </div>
      </div>
    </div>


    <div class="modal-overlay" id="modal-docs" style="display:none">
      <div class="modal modal-lg">
        <div class="modal-header">
          <div class="modal-title" id="docs-title">Documents</div>
          <button class="modal-close" onclick="closeDocs()">✕</button>
        </div>
        <div class="modal-body" id="docs-body"></div>
      </div>
    </div>

    <script type="module">
      import { requireAuth, roleOf } from "./js/auth.js";
      import { renderNav } from "./js/shared.js";
      import { supabase } from "./js/supabase.js";
      import {
        loadPortfolio,
        analysePortfolio,
        renderPortfolio,
      } from "./js/portfolio.js";
      import { openReport } from "./js/report-ui.js";

      const session = requireAuth();
      if (!session) throw new Error("Not authenticated");
      renderNav("landlord");

      const isLandlord = roleOf(session) === "landlord";
      let buildings = [];

      async function load() {
        const body = document.getElementById("ll-body");
        try {
          // A landlord sees only the buildings assigned to their login.
          // (An admin opening this page sees every building, as a preview.)
          let q = supabase.from("buildings").select("id, name").order("name");
          if (isLandlord) q = q.eq("landlord_username", session.username);
          const { data, error } = await q;
          if (error) throw error;
          buildings = data || [];

          document.getElementById("ll-sub").textContent = isLandlord
            ? `Welcome, ${session.full_name} · view only`
            : "Preview: showing all buildings (landlords see only their own)";

          const d = await loadPortfolio(buildings);
          renderPortfolio(body, d, analysePortfolio(d), {
            unitDetail: true,
            unitDocs: true,
            emptyText:
              "No buildings are linked to your login yet. Please contact the office.",
          });
        } catch (e) {
          console.error(e);
          body.innerHTML =
            '<div class="pf-card" style="color:var(--danger)">Could not load your buildings. Please refresh.</div>';
        }
      }

      // Contracts the tenant has signed and the landlord still has to sign
      async function loadSign() {
        const box = document.getElementById("ll-sign");
        if (!isLandlord) return;
        try {
          const r = await fetch("/api/landlord-sign-list?username=" + encodeURIComponent(session.username) + "&t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) return;
          const { requests } = await r.json();
          const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
          const fmt = (v) => new Date(v).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
          const todo = requests.filter((x) => x.status === "tenant_signed");
          const done = requests.filter((x) => x.status === "signed").slice(0, 5);
          if (!todo.length && !done.length) return;
          const row = (x, btn) => `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border)">
              <div style="flex:1;min-width:180px"><b>${esc(x.propertyName)} · Unit ${esc(x.apartmentNo)}</b>
                <div style="font-size:0.8rem;color:var(--text-muted)">Tenant: ${esc(x.tenantName)} · ${x.status === "signed" ? "Signed " + fmt(x.signedAt) : "Tenant signed " + fmt(x.tenantSignedAt)}</div></div>${btn}</div>`;
          box.innerHTML = `<div class="pf-card" style="margin-bottom:18px">
            <div style="font-weight:700;font-size:1.05rem">✍️ Contracts to sign ${todo.length ? `<span style="background:#e0a800;color:#000;border-radius:10px;padding:1px 9px;font-size:0.8rem">${todo.length}</span>` : ""}</div>
            ${todo.length ? todo.map((x) => row(x, `<a class="btn btn-green btn-sm" href="/landlord-sign.html?t=${encodeURIComponent(x.token)}">Review &amp; sign</a>`)).join("") : '<div style="font-size:0.85rem;color:var(--text-muted);padding-top:6px">Nothing is waiting for your signature.</div>'}
            ${done.length ? `<div style="font-size:0.75rem;color:var(--text-muted);margin-top:12px">Recently signed</div>` + done.map((x) => row(x, x.file ? `<a class="btn btn-outline btn-sm" href="${x.file}" target="_blank" rel="noopener">View PDF</a>` : "")).join("") : ""}
          </div>`;
        } catch (e) { /* not on the live server */ }
      }


      // ── Tenant documents (view and download only) ─────────────────
      const escH = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const sizeTxt = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round((n || 0) / 1024)) + " KB");
      const dateTxt = (v) => (v ? new Date(v).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) : "");
      window.closeDocs = () => { document.getElementById("modal-docs").style.display = "none"; };
      async function fetchFiles(url) {
        try {
          const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
          if (!r.ok) return null;
          return (await r.json()).files || [];
        } catch (e) { return null; }
      }
      function fileRows(files, label) {
        if (files === null) return '<p style="color:var(--text-muted);font-size:0.85rem">Not available right now.</p>';
        if (!files.length) return '<p style="color:var(--text-muted);font-size:0.85rem">None on file.</p>';
        return files.map((f) => `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--border)">
          <div style="flex:1;min-width:160px"><b>${escH(f.categoryLabel || label)}</b>
            <div style="font-size:0.8rem;color:var(--text-muted)">${escH(f.name)}${f.uploadedAt ? " · " + dateTxt(f.uploadedAt) : ""}${f.size ? " · " + sizeTxt(f.size) : ""}</div></div>
          <div><a class="btn btn-outline btn-sm" href="${escH(f.url)}" target="_blank" rel="noopener">View</a>
          <a class="btn btn-outline btn-sm" href="${escH(f.url)}?dl=1">⬇</a></div></div>`).join("");
      }
      document.addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-doc-unit]");
        if (!btn) return;
        const id = btn.dataset.docUnit;
        document.getElementById("docs-title").textContent = btn.dataset.docLabel || "Documents";
        const body = document.getElementById("docs-body");
        body.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
        document.getElementById("modal-docs").style.display = "flex";
        const [docs, contracts] = await Promise.all([
          fetchFiles("/api/docs/" + encodeURIComponent(id)),
          fetchFiles("/api/contracts/" + encodeURIComponent(id)),
        ]);
        body.innerHTML = `<div style="font-weight:700;margin-bottom:2px">Tenant documents</div>${fileRows(docs, "Document")}
          <div style="font-weight:700;margin:18px 0 2px">Contracts</div>${fileRows(contracts, "Contract")}`;
      });

      window.openReportPicker = () => openReport(buildings);
      loadSign();
      load();
    </script>
  </body>
</html>
