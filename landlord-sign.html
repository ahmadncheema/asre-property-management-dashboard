<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ASRE — Sign Contract</title>
    <link rel="stylesheet" href="css/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
      .docbox{max-height:70vh;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px;background:#fff}
      .docbox canvas{width:100%;height:auto;display:block;margin-bottom:8px;border:1px solid #d9dce5}
      #pad{width:100%;height:170px;border:2px dashed #9aa3c4;border-radius:10px;background:#fff;touch-action:none;display:block}
      .row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px}
      label.f{display:block;font-size:0.8rem;font-weight:600;margin:12px 0 4px;color:var(--text-muted)}
      .chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:0.9rem}
      .chk input{width:22px;height:22px;flex:none}
      .msg{padding:14px;border-radius:10px}.err{background:#fde8e8;color:#9b1c1c}.ok{background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4)}
      .hide{display:none}
    </style>
  </head>
  <body>
    <nav id="main-nav"></nav>
    <div class="page-wrapper">
      <div class="container" style="max-width:820px">
        <div class="page-header">
          <div>
            <div class="page-title">Review &amp; <span>Sign</span></div>
            <div class="page-subtitle" id="sub">Loading…</div>
          </div>
          <a class="btn btn-outline" href="/landlord.html">← Back</a>
        </div>
        <div id="app"></div>
      </div>
    </div>

    <script type="module">
      import { requireAuth } from "./js/auth.js";
      import { renderNav } from "./js/shared.js";
      import { assemble, dubaiTime } from "./js/addendum-pdf.js";

      const session = requireAuth();
      if (!session) throw new Error("Not authenticated");
      renderNav("landlord");
      const token = new URLSearchParams(location.search).get("t") || "";
      const U = encodeURIComponent(session.username);
      const app = document.getElementById("app");
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const say = (cls, html) => (app.innerHTML = `<div class="panel"><div class="msg ${cls}">${html}</div></div>`);
      const base = `/api/landlord-sign/${encodeURIComponent(token)}`;

      async function api(path, opt) {
        const sep = path.includes("?") ? "&" : "?";
        const r = await fetch(`${base}${path}${opt ? "" : sep + "username=" + U}`, { cache: "no-store", ...opt });
        let j = {}; try { j = await r.json(); } catch {}
        if (!r.ok) throw new Error(j.error || "Something went wrong. Please try again.");
        return j;
      }
      const bytes = async (what) => {
        const r = await fetch(`${base}/${what}?username=${U}&t=${Date.now()}`, { cache: "no-store" });
        if (!r.ok) throw new Error("Could not load the document.");
        return r.arrayBuffer();
      };

      let data;
      try { data = await api(""); } catch (e) { say("err", esc(e.message)); throw e; }
      document.getElementById("sub").textContent = `${data.fields.propertyName} · Unit ${data.fields.apartmentNo} · Tenant: ${data.tenant.name}`;

      app.innerHTML = `
        <div class="panel">
          <b>The tenant, ${esc(data.tenant.name)}, signed on ${esc(dubaiTime(data.tenant.signedAt))}.</b>
          <div style="font-size:0.85rem;color:var(--text-muted);margin:4px 0 10px">Please read the documents below, then sign at the bottom. Your signature goes on the contract pages and on the signature page.</div>
          <div class="docbox" id="docbox">Loading…</div>
        </div>
        <div class="panel">
          <b>Your signature</b>
          <label class="f" for="nm">Your full name</label>
          <input class="form-input" id="nm" style="width:100%" value="${esc(data.fields.landlordName)}" />
          <label class="f">Sign here (draw with your finger or mouse)</label>
          <canvas id="pad"></canvas>
          <div class="row"><button class="btn btn-outline btn-sm" id="clr" type="button">Clear</button><span id="hint" style="font-size:0.75rem;color:var(--text-muted)">Signature is required</span></div>
          <label class="chk"><input type="checkbox" id="ag" /><span>I have read and agree to these documents as the Landlord.</span></label>
          <button class="btn btn-green" id="go" style="width:100%;margin-top:14px" disabled>Sign and submit</button>
          <div id="err" class="msg err hide" style="margin-top:12px"></div>
        </div>`;

      // show exactly what the tenant signed
      (async () => {
        const box = document.getElementById("docbox");
        try {
          window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          const pdf = await window.pdfjsLib.getDocument({ data: await bytes("interim") }).promise;
          box.innerHTML = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const b = page.getViewport({ scale: 1 });
            const vp = page.getViewport({ scale: Math.min(2, (box.clientWidth || 340) / b.width * (window.devicePixelRatio || 1)) });
            const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
            box.appendChild(c);
            await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
          }
        } catch (e) { box.innerHTML = `<a href="${base}/interim?username=${U}" target="_blank">Open the document</a>`; }
      })();

      const cv = document.getElementById("pad"), go = document.getElementById("go");
      const ctx = cv.getContext("2d");
      const r0 = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
      cv.width = r0.width * d; cv.height = r0.height * d;
      ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1a4a"; ctx.fillStyle = "#0b1a4a";
      let drawing = false, inked = false, last = null;
      const pt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
      const check = () => {
        go.disabled = !(inked && document.getElementById("ag").checked && document.getElementById("nm").value.trim().length >= 2);
        document.getElementById("hint").textContent = inked ? "" : "Signature is required";
      };
      cv.addEventListener("pointerdown", (e) => { drawing = true; last = pt(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, 7); ctx.fill(); inked = true; check(); });
      cv.addEventListener("pointermove", (e) => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
      const up = () => (drawing = false);
      cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
      document.getElementById("clr").onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); inked = false; check(); };
      ["ag", "nm"].forEach((id) => document.getElementById(id).addEventListener("input", check));

      go.onclick = async () => {
        const errBox = document.getElementById("err"); errBox.classList.add("hide");
        go.disabled = true; go.textContent = "Signing…";
        try {
          const name = document.getElementById("nm").value.trim();
          const stamp = await api("/stamp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: session.username }) });
          const toUrl = async (buf) => { const fr = new FileReader(); return new Promise((res) => { fr.onload = () => res(fr.result); fr.readAsDataURL(new Blob([buf], { type: "image/png" })); }); };
          const sigPng = cv.toDataURL("image/png");
          const pdf = await assemble({
            template: data.template, fields: data.fields, contentHash: data.contentHash,
            contractBuf: data.hasContract ? await bytes("contract-document") : null,
            srcBuf: data.template.mode === "pdf" ? await bytes("document") : null,
            stampContractPage: data.stampContractPage, form: data.form, usage: data.usage,
            tenant: { name: data.tenant.name, signaturePng: await toUrl(await bytes("tenant-signature")), stamp: { at: data.tenant.signedAt, ref: data.tenant.ref } },
            landlord: { name, signaturePng: sigPng, stamp },
          });
          const res = await api("/submit", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: session.username, signerName: name, signature: sigPng, pdf, ref: stamp.ref, agreed: true }) });
          say("ok", `✅ <b>Signed. Thank you, ${esc(name)}.</b><br>Signed on ${esc(dubaiTime(res.signedAt))}. The fully signed contract has been saved and sent to the tenant and our leasing team.<br><br><a class="btn btn-outline" href="/landlord.html">Back to my buildings</a>`);
        } catch (e) {
          errBox.textContent = e.message; errBox.classList.remove("hide");
          go.textContent = "Sign and submit"; check();
        }
      };
    </script>
  </body>
</html>
